[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "snapmaker-u1-mcp"
version = "0.1.0.dev0"
description = "Local Snapmaker U1 MCP reads, G-code validation and verified no-start uploads"
requires-python = ">=3.11"
dependencies = ["mcp==1.30.0", "httpx==0.28.1", "pydantic>=2.11,<3"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.17.2"]

[project.scripts]
snapmaker-u1-mcp = "snapmaker_u1_mcp.server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.hatch.build.targets.wheel]
packages = ["src/snapmaker_u1_mcp"]
